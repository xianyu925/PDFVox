<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDFVox Task Status</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #task-status {
            border: 1px solid #ddd;
            padding: 16px;
            min-height: 160px;
        }
    </style>
</head>

<body>
    <h1>任务状态查询</h1>
    <div>
        <label>Task ID：<input type="text" id="task-id" /></label>
        <button id="check-btn">查询状态</button>
    </div>
    <div id="task-status">输入 task_id 后点击查询。</div>

    <script>
        const taskIdInput = document.getElementById('task-id');
        const checkBtn = document.getElementById('check-btn');
        const statusDiv = document.getElementById('task-status');

        checkBtn.addEventListener('click', async () => {
            const task_id = taskIdInput.value.trim();
            if (!task_id) {
                statusDiv.textContent = '请输入task_id';
                return;
            }
            statusDiv.textContent = '查询中...';
            try {
                const resp = await fetch(`/explain/status/${task_id}`);
                if (!resp.ok) throw new Error(await resp.text());
                const data = await resp.json();
                statusDiv.textContent = `状态：${data.status}\n详情：${data.detail || '无'}`;
            } catch (error) {
                statusDiv.textContent = `查询出错：${error}`;
            }
        });
    </script>
</body>

</html>

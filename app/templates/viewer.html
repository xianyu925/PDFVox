<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDFVox Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .toolbar {
            margin-bottom: 12px;
        }

        button {
            padding: 8px 12px;
            margin-right: 8px;
        }

        #pdf-preview {
            border: 1px solid #ddd;
            min-height: 400px;
            margin-top: 10px;
            padding: 12px;
        }

        #explanation {
            white-space: pre-wrap;
            margin-top: 16px;
            border: 1px solid #ddd;
            padding: 12px;
        }
    </style>
</head>

<body>
    <h1>PDF 预览与讲解</h1>
    <div class="toolbar">
        <label>File ID: <input type="text" id="file-id" /></label>
        <label style="margin-left: 10px;">课程名称: <input type="text" id="course-name" value="机器学习导论" /></label>
        <button id="load-btn">加载 PDF</button>
        <button id="prev-btn" disabled>上一页</button>
        <button id="next-btn" disabled>下一页</button>
        <button id="explain-btn" disabled>生成讲解</button>
    </div>
    <div id="page-info"></div>
    <div id="pdf-preview"></div>

    <h2>讲解与衔接</h2>
    <div id="explanation">请加载 PDF 并选择页码。</div>
    <audio id="audio-player" controls style="width:100%; margin-top:16px;"></audio>

    <script>
        const fileIdInput = document.getElementById('file-id');
        const loadBtn = document.getElementById('load-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const explainBtn = document.getElementById('explain-btn');
        const pageInfo = document.getElementById('page-info');
        const pdfPreview = document.getElementById('pdf-preview');
        const explanationDiv = document.getElementById('explanation');
        const audioPlayer = document.getElementById('audio-player');

        let currentPage = 1;
        let totalPages = 0;

        function getQueryParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name) || "";
        }

        async function fetchPdfInfo() {
            const fileId = fileIdInput.value.trim();
            if (!fileId) {
                alert('请先输入 File ID 或从上传页面打开本页面。');
                return;
            }
            explanationDiv.textContent = '正在加载 PDF 信息...';
            const resp = await fetch(`/pdf/${fileId}`);
            if (!resp.ok) {
                explanationDiv.textContent = 'PDF未找到，请确认File ID是否正确。';
                return;
            }
            const data = await resp.json();
            totalPages = data.pages.length;
            currentPage = 1;
            updateButtons();
            await loadPage();
        }

        function updateButtons() {
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;
            explainBtn.disabled = totalPages <= 0;
        }

        async function loadPage(page = currentPage) {
            const fileId = fileIdInput.value.trim();
            if (!fileId) {
                alert('请先输入 File ID。');
                return;
            }

            const resp = await fetch(`/pdf/${fileId}/page/${page}`);
            if (!resp.ok) {
                alert('无法加载页内容');
                return;
            }
            const data = await resp.json();
            pageInfo.textContent = `第 ${data.page} 页 / 共 ${totalPages} 页`;
            pdfPreview.innerHTML = `<img src="${data.image_url}" alt="page" style="max-width:100%;" />`;
            explanationDiv.textContent = data.text || '无文本';
            currentPage = data.page;
            updateButtons();
        }

        loadBtn.addEventListener('click', async () => {
            await fetchPdfInfo();
        });

        const initialFileId = getQueryParam('file_id');
        if (initialFileId) {
            fileIdInput.value = initialFileId;
            fetchPdfInfo();
        }

        prevBtn.addEventListener('click', async () => {
            if (currentPage > 1) {
                currentPage -= 1;
                await loadPage();
            }
        });

        nextBtn.addEventListener('click', async () => {
            if (currentPage < totalPages) {
                currentPage += 1;
                await loadPage();
            }
        });

        explainBtn.addEventListener('click', async () => {
            const fileId = fileIdInput.value.trim();
            const courseName = document.getElementById('course-name').value.trim() || '机器学习导论';
            if (!fileId) return;

            explanationDiv.textContent = '生成讲解中...';
            const resp = await fetch('/explain/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ file_id: fileId, page: currentPage, auto_next: false, course_name: courseName }),
            });
            if (!resp.ok) {
                explanationDiv.textContent = '讲解失败';
                return;
            }
            const data = await resp.json();
            explanationDiv.textContent = data.explanation + '\n\n衔接：' + (data.transition || '无');
            audioPlayer.src = data.audio_url;
            audioPlayer.load();
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配置 PDFVox</title>
    <style>
        :root { color-scheme: light; font-family: Inter, "Microsoft YaHei", sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f1f5f9; color: #0f172a; }
        main { width: min(520px, calc(100vw - 32px)); background: white; padding: 36px; border-radius: 18px; box-shadow: 0 18px 55px rgba(15, 23, 42, .12); }
        h1 { margin: 0 0 8px; font-size: 27px; }
        .intro { margin: 0 0 28px; color: #64748b; line-height: 1.65; }
        label { display: block; margin: 18px 0 7px; font-weight: 650; }
        input { width: 100%; border: 1px solid #cbd5e1; border-radius: 9px; padding: 12px 13px; font: inherit; }
        input:focus { outline: 3px solid #c7d2fe; border-color: #6366f1; }
        button { width: 100%; margin-top: 24px; padding: 12px; border: 0; border-radius: 9px; background: #4f46e5; color: white; font: inherit; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        #message { min-height: 24px; margin-top: 16px; font-size: 14px; line-height: 1.5; }
        .error { color: #b91c1c; }
        .success { color: #047857; }
        .privacy { margin-top: 20px; color: #64748b; font-size: 13px; line-height: 1.55; }
    </style>
</head>
<body>
<main>
    <h1>欢迎使用 PDFVox</h1>
    <p class="intro">首次使用只需填写两个 API Key。密钥将保存在当前 Windows 用户的系统凭据管理器中，不会写入 PDF 或运行日志。</p>
    <form id="settings-form">
        <label for="llm-api-key">LLM API Key</label>
        <input id="llm-api-key" name="llm_api_key" type="password" required autocomplete="off" spellcheck="false">

        <label for="tts-api-key">TTS API Key</label>
        <input id="tts-api-key" name="tts_api_key" type="password" required autocomplete="off" spellcheck="false">

        <button id="save-button" type="submit">保存并进入 PDFVox</button>
        <div id="message" role="status" aria-live="polite"></div>
    </form>
    <p class="privacy">模型、音色和服务地址已由应用预设。以后可再次打开此页面替换密钥。</p>
</main>
<script>
    const form = document.getElementById('settings-form');
    const button = document.getElementById('save-button');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        button.disabled = true;
        message.className = '';
        message.textContent = '正在安全保存配置…';
        try {
            const response = await fetch('/settings/configure', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    llm_api_key: form.llm_api_key.value.trim(),
                    tts_api_key: form.tts_api_key.value.trim(),
                }),
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.detail || '配置保存失败');
            message.className = 'success';
            message.textContent = '配置已保存，正在进入应用…';
            window.location.replace('/');
        } catch (error) {
            message.className = 'error';
            message.textContent = error.message || '配置保存失败';
            button.disabled = false;
        }
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDFVox 沉浸式 AI 讲解</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-body: #f1f5f9;
            --bg-surface: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            height: 100vh;
            display: flex;
            padding: 16px;
            overflow: hidden;
            gap: 16px;
        }

        .left-panel {
            width: 340px;
            background-color: var(--bg-surface);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            overflow-y: auto;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .left-panel::-webkit-scrollbar,
        .pdf-container::-webkit-scrollbar {
            width: 8px;
        }

        .left-panel::-webkit-scrollbar-track,
        .pdf-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .left-panel::-webkit-scrollbar-thumb,
        .pdf-container::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-color), #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .required {
            color: var(--danger);
        }

        input[type="text"] {
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
            outline: none;
            background-color: #f8fafc;
            color: var(--text-main);
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        button {
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }

        #explain-all-btn {
            background: linear-gradient(135deg, var(--primary-color), #6366f1);
            color: white;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        #explain-all-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
        }

        button:disabled {
            background: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .right-panel {
            flex: 1;
            background-color: #e2e8f0;
            border-radius: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.02);
            transition: all 0.3s ease;
        }

        /* 隐藏原生全屏默认背景 */
        .right-panel:fullscreen {
            background-color: #0f172a;
            border-radius: 0;
        }

        .right-panel:fullscreen {
            width: 100vw;
            height: 100vh;
            padding: 0;
        }

        .right-panel:fullscreen .pdf-container {
            height: 100vh;
            padding: 0;
            display: flex;
            align-items: stretch;
            justify-content: center;
        }

        /* 全屏放映模式：页面尽可能填满屏幕（无字幕预留） */
        .right-panel:fullscreen #pdf-preview {
            width: 100vw;
            max-width: none;
            gap: 0;
            padding: 0;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .right-panel:fullscreen .pdf-page-wrapper {
            width: 100vw;
            height: 100vh;
            margin: 0;
            border-radius: 0;
            box-shadow: none;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .right-panel:fullscreen .pdf-page-wrapper img {
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        /* 全屏时在 PPT 底部显示字幕（覆盖在 PPT 上方，不留出额外空间） */
        .right-panel:fullscreen .global-subtitle {
            display: block;
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            background: rgba(15, 23, 42, 0.65);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 20px;
            line-height: 1.4;
            text-align: center;
            pointer-events: none;
            z-index: 9999;
            opacity: 1;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        }

        /* 全屏时图片不再保留字幕高度，允许图片占满视口，字幕悬浮覆盖 */
        .right-panel:fullscreen .pdf-page-wrapper img {
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .pdf-container {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            scroll-behavior: smooth;
        }

        #pdf-preview {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px;
            padding-bottom: 200px;
            /* 为字幕留出空间 */
        }

        .pdf-page-wrapper {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            width: 100%;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .pdf-page-wrapper.active-page {
            transform: scale(1.02);
            box-shadow: 0 0 0 4px var(--primary-color), 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        }

        .pdf-page-wrapper img {
            width: 100%;
            display: block;
            height: auto;
        }

        /* ----- 全屏按钮 ----- */
        .fullscreen-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: auto;
            padding: 10px 16px;
            background-color: rgba(15, 23, 42, 0.7);
            color: white;
            border-radius: 8px;
            backdrop-filter: blur(8px);
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fullscreen-btn:hover {
            background-color: rgba(15, 23, 42, 0.9);
            transform: scale(1.05);
        }

        /* ----- 全局沉浸式底部字幕 ----- */
        .global-subtitle {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 900px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px 32px;
            color: #f8fafc;
            font-size: 22px;
            line-height: 1.6;
            text-align: center;
            font-weight: 500;
            letter-spacing: 1px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: translate(-50%, 20px);

            /* 保持最多显示两行，超出隐藏 */
            max-height: 120px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .global-subtitle.active {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .page-counter {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            z-index: 10;
        }

        #hidden-dummies {
            display: none;
        }
    </style>
</head>

<body>
    <div id="hidden-dummies"></div>

    <div class="left-panel" id="left-panel">
        <div class="logo">PDFVox</div>
        <div class="input-group">
            <label for="course-name">课程名称 <span class="required">*</span></label>
            <input type="text" id="course-name" placeholder="为您的课程命名..." required value="机器学习导论" />
        </div>
        <button id="explain-all-btn" disabled>一键生成沉浸式讲解</button>
        <button id="ask-btn"
            style="margin-top:8px; background: linear-gradient(135deg,#10b981,#06b6d4); color: white;">提问</button>
        <div class="voice-bar" style="margin-top:12px;">
            <button id="play-pause-btn"
                style="padding:10px 12px; border-radius:8px; background:#fff; border:1px solid var(--border-color); cursor:pointer;">播放</button>
            <input id="page-slider" type="range" min="1" value="1"
                style="width:100%; margin:0 8px; vertical-align:middle;" />
            <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="1" title="音量"
                style="width:40px; vertical-align:middle;" />
        </div>
        <div style="font-size: 13px; color: var(--text-muted); text-align: center; margin-top: -10px;">
            基于 SSE 流式架构，音画同步
        </div>
    </div>

    <!-- 右侧面板 (全屏区域) -->
    <div class="right-panel" id="right-panel">
        <button id="fullscreen-btn" class="fullscreen-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3">
                </path>
            </svg>
            沉浸模式
        </button>

        <div class="page-counter" id="page-counter">1 / 0</div>

        <div class="pdf-container" id="pdf-container">
            <div id="pdf-preview">
                <div style="color: #64748b; margin-top: 100px; font-weight: 500;">正在加载 PDF 文档...</div>
            </div>
        </div>

        <!-- 全局字幕框 -->
        <div class="global-subtitle" id="global-subtitle"></div>
    </div>
    <script src="/static/viewer.js"></script>
</body>

</html>
